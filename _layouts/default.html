<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title | escape }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/end.css' | relative_url }}">
  </head>
  <body class="{% if page.url == '/' %}end-root{% else %}end-entry{% endif %}">
    <header class="end-shell end-header">
      <a class="end-mark" href="{{ '/' | relative_url }}" aria-label="END home">END</a>
    </header>
    <main class="end-shell end-page">
      {{ content }}
    </main>
  </body>
</html>
