<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"
role="img" aria-labelledby="poster-title poster-desc">
<title id="poster-title">Make it pullable! — companion poster</title>
<desc id="poster-desc">Poster conceptuel sur les signaux push et pull, six façons dont le travail peut ne pas être réellement pullable, deux capacités complémentaires qui peuvent limiter le flow, et une question diagnostique.</desc>
<rect width="1600" height="2000" fill="#F2EFE6"/>
<text x="120" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="94" font-weight="760" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Make it pullable!</tspan></text>
<line x1="120" y1="185" x2="410" y2="185" stroke="#E64D3D" stroke-width="12" stroke-linecap="round"/>
<text x="120" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="39" font-weight="560" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Le travail ne manque pas.</tspan><tspan x="120" dy="50.7">Les options réellement absorbables peuvent manquer.</tspan></text>
<line x1="120" y1="348" x2="1480" y2="348" stroke="#111418" stroke-width="2" opacity="0.24"/>
<text x="120" y="390" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="31" font-weight="780" fill="#E64D3D" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">PUSH</tspan></text>
<text x="120" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="620" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Quelque chose doit avancer.</tspan><tspan x="120" dy="44.2">Où est-ce qu’on peut l’envoyer?</tspan></text>
<text x="785" y="390" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="31" font-weight="780" fill="#E64D3D" text-anchor="start" opacity="1"><tspan x="785" dy="0.0">PULL</tspan></text>
<text x="785" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="620" fill="#111418" text-anchor="start" opacity="1"><tspan x="785" dy="0.0">Une capacité se libère.</tspan><tspan x="785" dy="44.2">Qu’est-ce que le système peut utilement prendre?</tspan></text>
<line x1="720" y1="380" x2="720" y2="540" stroke="#8E8B85" stroke-width="2" opacity="0.7"/>
<text x="120" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Quand le travail n’est pas réellement pullable…</tspan></text>
<line x1="120" y1="657" x2="1480" y2="657" stroke="#111418" stroke-width="2" opacity="0.24"/>
<line x1="120" y1="691" x2="725" y2="691" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="120" y="735" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Un engagement devient du travail</tspan><tspan x="120" dy="35.2">à démarrer avant qu’on ait confronté</tspan><tspan x="120" dy="35.2">ses contraintes au système.</tspan></text>
<line x1="840" y1="691" x2="1480" y2="691" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="840" y="735" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="840" dy="0.0">La même décision, expertise</tspan><tspan x="840" dy="35.2">ou permission reste</tspan><tspan x="840" dy="35.2">un passage obligé.</tspan></text>
<line x1="120" y1="886" x2="725" y2="886" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="120" y="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">On découpe une solution en plus de tâches</tspan><tspan x="120" dy="35.2">sans créer plus de chemins utiles.</tspan></text>
<line x1="840" y1="886" x2="1480" y2="886" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="840" y="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="840" dy="0.0">Un item est `Ready`, mais attend encore</tspan><tspan x="840" dy="35.2">un environnement, une release</tspan><tspan x="840" dy="35.2">ou une dépendance.</tspan></text>
<line x1="120" y1="1081" x2="725" y2="1081" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="120" y="1125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">On devient meilleur à coordonner</tspan><tspan x="120" dy="35.2">une friction récurrente qu’à en réduire la cause.</tspan></text>
<line x1="840" y1="1081" x2="1480" y2="1081" stroke="#8E8B85" stroke-width="2" opacity="0.6"/>
<text x="840" y="1125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25.5" font-weight="520" fill="#111418" text-anchor="start" opacity="1"><tspan x="840" dy="0.0">De la capacité attend la prochaine</tspan><tspan x="840" dy="35.2">assignation pendant que le flow</tspan><tspan x="840" dy="35.2">bloque ailleurs.</tspan></text>
<line x1="120" y1="1297" x2="1480" y2="1297" stroke="#111418" stroke-width="3"/>
<text x="120" y="1345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="37" font-weight="700" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Le flow peut être limité par:</tspan></text>
<rect x="120" y="1417" width="575" height="142" rx="14" fill="none" stroke="#111418" stroke-width="2.5"/>
<rect x="905" y="1417" width="575" height="142" rx="14" fill="none" stroke="#111418" stroke-width="2.5"/>
<text x="155" y="1467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="680" fill="#111418" text-anchor="start" opacity="1"><tspan x="155" dy="0.0">la capacité à absorber</tspan><tspan x="155" dy="38.8">du travail pullable</tspan></text>
<text x="940" y="1467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="680" fill="#111418" text-anchor="start" opacity="1"><tspan x="940" dy="0.0">la capacité à rendre</tspan><tspan x="940" dy="38.8">le prochain travail pullable</tspan></text>
<line x1="735" y1="1489" x2="865" y2="1489" stroke="#E64D3D" stroke-width="7" stroke-linecap="round"/>
<polyline points="752,1471 733,1489 752,1507" fill="none" stroke="#E64D3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="848,1471 867,1489 848,1507" fill="none" stroke="#E64D3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="1619" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111418" text-anchor="middle" opacity="1"><tspan x="800" dy="0.0">La contrainte peut bouger.</tspan></text>
<line x1="120" y1="1682" x2="1480" y2="1682" stroke="#111418" stroke-width="2" opacity="0.24"/>
<text x="120" y="1740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="540" fill="#55585C" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">La pullability dépend du travail, de la capacité et du système.</tspan></text>
<text x="120" y="1842" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="43" font-weight="760" fill="#111418" text-anchor="start" opacity="1"><tspan x="120" dy="0.0">Quand une capacité se libère, quelles options utiles</tspan><tspan x="120" dy="54.2">le système peut-il réellement absorber?</tspan></text>
</svg>